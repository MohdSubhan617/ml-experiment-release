[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-experiment-release"
version = "0.1.0"
description = "Model release gate evaluating reproducibility, quality thresholds, and artifact metadata"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pip-audit>=2.7,<3", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
